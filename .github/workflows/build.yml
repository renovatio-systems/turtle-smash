name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: true

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - uses: actions/upload-artifact@v4
        with:
          name: tft_clock
          path: |
            build/src/tft_clock.uf2
            build/src/tft_clock.elf

  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run emulator test
        run: |
          cmake -S tests/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: build-host/*.ppm
